[package]
name = "hector-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Low-latency SportyBet market data and guarded execution CLI"
license = "MIT"
repository = "https://github.com/therealsylva/hector"

[[bin]]
name = "hector"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rsa = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
