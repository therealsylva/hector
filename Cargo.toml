[package]
name = "hector-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Low-latency SportyBet market data and guarded execution CLI"
license = "MIT"
repository = "https://github.com/therealsylva/hector"

[[bin]]
name = "hector"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = "7.1"
console = "0.15"
crossterm = { version = "0.28", features = ["event-stream"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
directories = "6.0"
futures-util = "0.3"
indicatif = "0.17"
percent-encoding = "2.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rsa = "0.9"
rustyline = "15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
