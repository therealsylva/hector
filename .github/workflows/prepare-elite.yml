name: Prepare Elite TUI

on:
  push:
    branches: [feat/elite-repl-tui]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/elite-repl-tui
      - run: cargo fmt --all
      - name: Commit formatting and remove one-shot workflow
        run: |
          rm .github/workflows/prepare-elite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: format CI corrections"
            git push origin HEAD:feat/elite-repl-tui
          fi
