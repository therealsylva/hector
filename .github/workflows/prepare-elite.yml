name: Prepare Elite TUI

on:
  push:
    branches: [feat/elite-repl-tui]

permissions:
  contents: write

jobs:
  format-and-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/elite-repl-tui
      - name: Format sources and refresh lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit generated files and remove one-shot workflow
        run: |
          rm .github/workflows/prepare-elite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: format elite terminal and refresh lockfile"
            git push origin HEAD:feat/elite-repl-tui
          fi
