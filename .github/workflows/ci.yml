name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --locked --all-targets

  release-build:
    name: Linux binary artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --release --locked
      - name: Package binary and checksum
        run: |
          short_sha="${GITHUB_SHA::12}"
          install -Dm755 target/release/hector dist/hector
          tar -C dist -czf "dist/hector-${short_sha}-linux-x86_64.tar.gz" hector
          sha256sum "dist/hector-${short_sha}-linux-x86_64.tar.gz" > "dist/hector-${short_sha}-linux-x86_64.tar.gz.sha256"
          rm dist/hector
      - uses: actions/upload-artifact@v4
        with:
          name: hector-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
